<!doctype html><html><head><meta charset="utf-8"><title>Boat, bridge, workbench</title><style>body{font:14px system-ui;background:#1b1d23;color:#e8e2d8;margin:30px}h1{font-size:26px}h2{font-size:18px;color:#d3b893;margin-top:30px}.note{color:#b9b5af}.grid{display:flex;gap:14px;flex-wrap:wrap}.card{background:#2b2d35;border:1px solid #45464a;border-radius:8px;padding:12px;min-width:230px}.pair{display:flex;gap:8px}.pair>div{text-align:center}.pair img{width:110px;height:105px;object-fit:contain}small{display:block;color:#aaa}.scene{background:#283942;border-radius:8px;width:420px;height:150px;position:relative}.scene img{position:absolute;object-fit:contain}.scene .boat{left:40px;top:71px;width:112px;height:60px}.scene .bridge{left:155px;top:15px;width:128px;height:88px}.scene .bench{left:300px;top:30px;width:104px;height:84px}</style></head><body><h1>Boat, bridge &amp; workbench</h1><p class="note">Refined timber, structural joinery and use-wear, with original base filenames and canvas sizes.</p><div class="grid"><div class="card"><b>boat.svg</b><div class="pair"><div><img src="before/sprites/boat.svg"><small>Current</small></div><div><img src="sprites/boat.svg"><small>Refined</small></div></div></div><div class="card"><b>bridge.svg</b><div class="pair"><div><img src="before/sprites/bridge.svg"><small>Current</small></div><div><img src="sprites/bridge.svg"><small>Refined</small></div></div></div><div class="card"><b>workbench.svg</b><div class="pair"><div><img src="before/sprites/workbench.svg"><small>Current</small></div><div><img src="sprites/workbench.svg"><small>Refined</small></div></div></div></div><h2>Shared scale and material check</h2><div class="scene"><img class="boat" src="sprites/boat.svg"><img class="bridge" src="sprites/bridge.svg"><img class="bench" src="sprites/workbench.svg"></div></body></html>
